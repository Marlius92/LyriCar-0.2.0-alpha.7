name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-core:
    name: Swift core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift test

  windows-preview:
    name: Windows preview tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: WindowsPreview/requirements-preview.txt
      - name: Install preview test dependencies
        run: python -m pip install -r WindowsPreview/requirements-preview.txt
      - name: Run Windows preview tests
        run: python -m unittest discover -s WindowsPreview/tests -v
      - name: Compile Python sources
        run: python -m compileall -q WindowsPreview

  ios-builds:
    name: iOS simulator builds
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Build standard app
        run: |
          set -o pipefail
          xcodebuild \
            -project LyriCar.xcodeproj \
            -scheme LyriCar \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData-standard \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build-ios-standard.log
      - name: Build companion app
        run: |
          set -o pipefail
          xcodebuild \
            -project LyriCar.xcodeproj \
            -scheme LyriCarCompanion \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData-companion \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build-ios-companion.log
      - name: Build experimental CarPlay app
        run: |
          set -o pipefail
          xcodebuild \
            -project LyriCar.xcodeproj \
            -scheme LyriCarExperimental \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData-experimental \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build-ios-experimental.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-logs
          path: |
            build-ios-standard.log
            build-ios-companion.log
            build-ios-experimental.log
